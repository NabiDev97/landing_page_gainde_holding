services:
  - type: web
    name: lpgh-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    branch: main
    plan: free
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: 'false'
      - key: RUN_MIGRATIONS
        value: 'false'
      - key: RUN_SEEDS
        value: 'false'
      - key: APP_URL
        value: https://example.com
      - key: VITE_API_URL
        value: ''
    buildCommand: ''
    startCommand: ''
